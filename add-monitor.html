<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>333 Watcher</title>
  <link rel="stylesheet" href="add-monitor.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo-dot"></div>
      <h1 class="title">333 Watcher</h1>
      <span id="unread-badge" class="unread-badge hidden">0</span>
      <span id="sync-badge" class="sync-badge">Chrome 同步：已启用</span>
    </header>

    <section id="notify-card" class="notify-card">
      <button type="button" id="history-toggle" class="notify-card-header">
        <span class="notify-card-title">
          <span id="notify-dot" class="notify-dot hidden"></span>
          通知历史
          <span id="notify-summary" class="notify-summary">暂无通知</span>
        </span>
        <span class="notify-card-actions">
          <span id="clear-read-btn" class="clear-read-btn hidden">清除已读</span>
          <span id="mark-all-read-btn" class="mark-all-read hidden">全部已读</span>
          <span id="history-arrow" class="history-arrow">▸</span>
        </span>
      </button>
      <ul id="history-list" class="history-list hidden"></ul>
    </section>

    <div id="editing-banner" class="editing-banner hidden">
      <span>正在编辑</span>
      <button type="button" id="cancel-edit-btn" class="btn-ghost-small">取消编辑</button>
    </div>

    <form id="monitor-form" class="add-form">
      <label class="field">
        <span class="field-label">监控类型</span>
        <select id="input-type">
          <option value="page">整个网页变化</option>
          <option value="element">指定内容变化</option>
        </select>
      </label>
      <label class="field">
        <span class="field-label">监控名称</span>
        <input id="input-name" type="text" placeholder="例如：GitHub 首页" required>
      </label>
      <label class="field">
        <span class="field-label">监控网址</span>
        <input id="input-url" type="url" placeholder="https://example.com" required>
      </label>
      <label class="field">
        <span class="field-label">检查间隔（分钟）</span>
        <input id="input-interval" type="number" min="1" value="500" required>
        <span class="field-hint interval-hint">默认 500 分钟≈8小时，适合公告/低频监控；高频可改为 5-60 分钟</span>
      </label>

      <div id="element-section" class="element-section hidden">
        <button type="button" id="pick-element-btn" class="btn-ghost">选择网页元素</button>
        <div id="picked-info" class="selected-info hidden"></div>
      </div>

      <button type="submit" id="submit-btn" class="btn-primary">保存监控</button>
      <button type="button" id="test-notify-btn" class="btn-ghost">发送测试通知</button>
      <p id="status-msg" class="status-msg hidden"></p>
    </form>

    <section id="test-mode-card" class="test-mode-card">
      <button type="button" id="test-mode-toggle" class="test-mode-header">
        <span class="test-mode-title">🧪 测试模式</span>
        <span class="test-mode-sub">验证监控是否生效</span>
        <span id="test-mode-arrow" class="test-mode-arrow">▸</span>
      </button>
      <div id="test-mode-body" class="test-mode-body hidden">
        <p class="test-hint">无需真实网站。创建本地测试监控 → 点“模拟变化” → 点“立即检查” → 应收到通知并在“通知历史”出现记录。</p>
        <div class="test-actions">
          <button type="button" id="test-create-btn" class="btn-primary" style="font-size:12px;padding:8px 0">创建测试监控</button>
          <div class="test-row">
            <button type="button" id="test-change-btn" class="btn-ghost" style="flex:1">模拟变化</button>
            <button type="button" id="test-check-btn" class="btn-ghost" style="flex:1">立即检查</button>
          </div>
        </div>
        <div id="test-status" class="test-status hidden"></div>
        <div id="test-detail" class="test-detail hidden"></div>
        <div class="test-foot">
          <span class="field-hint">测试 URL: <code>333-test://demo</code> · 仅本地 · 间隔 1 分钟</span>
          <button type="button" id="test-clear-btn" class="btn-ghost-small">清理测试数据</button>
        </div>
      </div>
    </section>

    <div id="overwrite-confirm" class="confirm-bar hidden">
      <p class="confirm-text">该网址已经存在，是否覆盖？</p>
      <div class="confirm-actions">
        <button type="button" id="confirm-overwrite-btn" class="btn-danger">覆盖保存</button>
        <button type="button" id="cancel-overwrite-btn" class="btn-ghost">取消</button>
      </div>
    </div>

    <section class="monitor-section">
      <div class="monitor-section-head">
        <p class="section-label">已保存的监控（<span id="monitor-count">0</span>）</p>
        <button type="button" id="bulk-interval-btn" class="btn-ghost-small">全部500分钟</button>
      </div>
      <ul id="monitor-list" class="watcher-list"></ul>
    </section>

    <div id="migrate-bar" class="migrate-bar">
      <div class="migrate-head">
        <span class="migrate-title">数据迁移</span>
        <span class="migrate-hint">本地版 ↔ 商店版互导</span>
      </div>
      <div class="migrate-actions">
        <button type="button" id="export-btn" class="btn-ghost-small">导出设置</button>
        <button type="button" id="import-toggle-btn" class="btn-ghost-small">导入设置</button>
      </div>
      <div id="import-box" class="import-box hidden">
        <textarea id="import-area" class="import-area" rows="4" placeholder="把另一版本的导出内容粘贴到这里"></textarea>
        <button type="button" id="import-confirm-btn" class="btn-primary">确认导入</button>
      </div>
      <p id="migrate-status" class="migrate-status hidden"></p>
    </div>

    <footer class="footer">
      <span id="footer-version" class="footer-version">333 Watcher v0.6.15</span>
      <a id="about-link" class="footer-link" href="https://github.com/lijianbin2/333watch">GitHub</a>
    </footer>
  </div>

  <script src="add-monitor.js"></script>
</body>
</html>
